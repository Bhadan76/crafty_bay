name: crafty_bay
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0
  flutter_facebook_auth: ^7.2.0
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  get: ^4.7.3
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.1.2
  logger: ^2.7.0
  email_validator: ^3.0.0
  shared_preferences: ^2.5.5
  flutter_screenutil: ^5.9.3
  google_sign_in: ^7.2.0
  dio: ^5.9.0
  flutter_sslcommerz: ^3.0.2
  flutter_bkash: ^1.0.1
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1 //api thake asa image gula ke memory te catch korbe
  shimmer: ^3.0.0 // api thake data asar ag porjonto nice ui show korbe


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/


